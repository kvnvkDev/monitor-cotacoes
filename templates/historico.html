<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='style.css') }}" />
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script>
        async function preencherSelect() {
            const response = await fetch("{{ url_for('static',filename='data.json') }}" );
            const dados = await response.json();

            const select = document.getElementById('acoes');
            var keys = Object.keys(dados);
            console.log(typeof keys)
            
            for(var i in keys){
                const option = document.createElement('option');
                option.value = keys[i]; 
                option.text = keys[i];
                select.appendChild(option);
            }
        }
        // Envia o valor seleciona para gera o gráfico
        async function enviarValor(valor, per) {
            console.log(valor)
            const response = await fetch('/gerarGrafico', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ valor: valor, period: per })
            });
            const data = await response.json();
            const img = document.getElementById('grafico');
            img.src = 'data:image/png;base64,' + data.image;
        }

        document.addEventListener('DOMContentLoaded', () => {
            preencherSelect();
            const select = document.getElementById('acoes');
            const period = document.getElementById('period');
            console.log(period)
            select.addEventListener('change', (event) => {
                const valor = event.target.value;
                enviarValor(valor, period.value);
            });
            period.addEventListener('change', (event) => {
                const valor = event.target.value;
                enviarValor(select.value, valor);
            });
        });
    </script>
</head>

<body>
    <a href="/"><h1>Monitor de ações</h1></a>
    <div id="principal">
        <div class="sessao1">
            <h3>Histórico</h3>
            <div>
                <label for="acoes">Selecione a ação</label>
                <select name="acoes" id="acoes">
                </select>
                <label for="period">Selecione o período de busca</label>
                <select name="period" id="period">
                    <option value="5d">7 dias</option>
                    <option value="1mo">1 mês</option>
                    <option value="6mo">6 meses</option>
                    <option value="1y">1 ano</option>
                </select>
            </div>
            <img id="grafico" src="" alt="Gráfico">
        </div>
        <div class="sessao2">
            <ul>
                <li><a href="listaAcoes">Suas ações</a></li>
                <li><a href="historico">Histórico</a></li>
                <li><a href="configuracoes">Configurações</a></li>
                <li><a href="sobre">Sobre</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
